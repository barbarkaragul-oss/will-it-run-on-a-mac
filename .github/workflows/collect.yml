name: collect
# Records what each platform's tools say about themselves (--help, man pages) and what happens when
# the classic GNU-only flags are actually executed there. Artifacts are the raw evidence.
on:
  workflow_dispatch:
  schedule:
    # GitHub queues scheduled workflows and drops them to the back of the line at busy times;
    # the top of the hour is the worst, and '0 6 * * 1' is one of the most common crons there is.
    # On 2026-09-14 all four of these repos missed their slot by more than three hours, so the
    # times were moved to odd minutes, spread apart so they do not queue behind each other either.
    - cron: '19 7 * * 1'   # Mondays 07:19 UTC: re-record every platform, rebuild the database, commit if it changed
  push:
    paths:
      - collector/**
      - .github/workflows/collect.yml

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sh collector/collect.sh ${{ matrix.platform }}
      - run: sh collector/probe.sh ${{ matrix.platform }}
      - run: sh collector/probe-all.sh ${{ matrix.platform }}
      - run: cat out/${{ matrix.platform }}/_platform.txt; head -5 out/${{ matrix.platform }}/_probes.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: out-${{ matrix.platform }}
          path: out
          if-no-files-found: error

  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # BusyBox lives in a container; actions cannot run inside Alpine (no glibc), so docker run it is.
      - run: docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c 'sh collector/collect.sh alpine && sh collector/probe.sh alpine && sh collector/probe-all.sh alpine'
      - run: sudo chown -R "$(id -u)" out; cat out/alpine/_platform.txt; head -5 out/alpine/_probes.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: out-alpine
          path: out
          if-no-files-found: error

  # Turn the three recordings into data/flags.json and the per-tool files the site fetches; on the weekly run and on
  # manual dispatch the result is committed, so the database is only ever what the platforms said this week.
  refresh:
    needs: [native, alpine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: out-*
          path: out
          merge-multiple: true
      - run: ls out; npx tsx scripts/extract.ts
      - run: npm test
      - run: npx tsx scripts/build.ts
      - name: Commit the refreshed database
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: weekly re-recording of Ubuntu, macOS and Alpine ($(date -u +%Y-%m-%d))"
          git push

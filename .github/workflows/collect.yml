name: collect
# Records what each platform's tools say about themselves (--help, man pages) and what happens when
# the classic GNU-only flags are actually executed there. Artifacts are the raw evidence.
on:
  workflow_dispatch:
  schedule:
    # GitHub's documentation says a scheduled run can be delayed when Actions is busy and, under
    # enough load, dropped altogether: no run appears, and nothing anywhere records that one was
    # skipped. On 2026-09-14 the first scheduled slot for this workflow produced no run at all,
    # so the time was moved off the top of the hour in case congestion was the reason. That is a
    # guess and not a diagnosis. What does not rest on the guess: a cron on our own server asks
    # GitHub every day whether this workflow has run in the last seven days and dispatches it if
    # it has not, so the weekly claim on the page holds whether or not this schedule fires.
    - cron: '19 7 * * 1'   # Mondays 07:19 UTC: re-record every platform, rebuild the database, commit if it changed
  push:
    paths:
      - collector/**
      - .github/workflows/collect.yml

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Ubuntu ships bash and dash; zsh and ksh are installed so the shell probes can compare them
      # on the same machine. macOS already has bash 3.2, zsh and ksh in /bin.
      - if: matrix.platform == 'ubuntu'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh ksh >/dev/null
      - run: sh collector/collect.sh ${{ matrix.platform }}
      - run: sh collector/probe.sh ${{ matrix.platform }}
      - run: sh collector/probe-all.sh ${{ matrix.platform }}
      - run: sh collector/shells/probe-shells.sh ${{ matrix.platform }}
      - run: cat out/${{ matrix.platform }}/_platform.txt; head -5 out/${{ matrix.platform }}/_probes.tsv; head -3 out/${{ matrix.platform }}/_shells.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: out-${{ matrix.platform }}
          path: out
          if-no-files-found: error

  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # BusyBox lives in a container; actions cannot run inside Alpine (no glibc), so docker run it is.
      # bash, zsh and dash are added only for the shell probes; the tool recordings still see BusyBox alone.
      - run: docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c 'sh collector/collect.sh alpine && sh collector/probe.sh alpine && sh collector/probe-all.sh alpine && apk add --no-cache bash zsh dash >/dev/null && sh collector/shells/probe-shells.sh alpine'
      - run: sudo chown -R "$(id -u)" out; cat out/alpine/_platform.txt; head -5 out/alpine/_probes.tsv; head -3 out/alpine/_shells.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: out-alpine
          path: out
          if-no-files-found: error

  # Turn the three recordings into data/flags.json and the per-tool files the site fetches; on the weekly run and on
  # manual dispatch the result is committed, so the database is only ever what the platforms said this week.
  refresh:
    needs: [native, alpine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: out-*
          path: out
          merge-multiple: true
      - run: ls out; npx tsx scripts/extract.ts
      - run: npx tsx scripts/extract-shells.ts
      - run: npm test
      - run: npx tsx scripts/build.ts
      - name: Commit the refreshed database
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: weekly re-recording of Ubuntu, macOS and Alpine ($(date -u +%Y-%m-%d))"
          git push

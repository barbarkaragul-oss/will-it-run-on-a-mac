# One-off spike: run the shell-semantics probes under every shell each platform offers and
# upload the raw TSVs. Dispatch only, commits nothing, touches no data. If the differences are
# real and numerous, this becomes a proper collector leg; if not, the branch is deleted.
name: shells spike
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the shells the platform does not ship (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh dash ksh >/dev/null
      - name: Which shells exist
        run: |
          for s in /bin/sh /bin/bash bash /bin/zsh zsh /bin/dash dash ksh; do
            printf '%-10s -> %s\n' "$s" "$(command -v "$s" 2>/dev/null || echo none)"
          done
          echo "--- macOS bash is the 2007 one: ---"; /bin/bash --version | head -n 1; bash --version | head -n 1 || true
      - name: Run the probes
        run: |
          case "${{ runner.os }}" in
            Linux) sh spike/shells/probe-shells.sh ubuntu out/shells-ubuntu.tsv /bin/bash /bin/sh /bin/dash /bin/zsh /bin/ksh ;;
            macOS) sh spike/shells/probe-shells.sh macos out/shells-macos.tsv /bin/bash /bin/sh /bin/zsh /bin/ksh "$(command -v bash)" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: shells-${{ matrix.os }}
          path: out/*.tsv
          retention-days: 7

  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run the probes inside Alpine (busybox ash is /bin/sh there)
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c '
            apk add --no-cache bash zsh dash >/dev/null &&
            sh spike/shells/probe-shells.sh alpine out/shells-alpine.tsv /bin/sh /bin/ash /bin/bash /bin/zsh /usr/bin/dash'
      - uses: actions/upload-artifact@v7
        with:
          name: shells-alpine
          path: out/*.tsv
          retention-days: 7
